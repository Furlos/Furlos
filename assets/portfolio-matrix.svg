<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#0b1730"/></linearGradient>
  <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#58a6ff"/><stop offset="1" stop-color="#a371f7"/></linearGradient>
  <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3fb950"/><stop offset="1" stop-color="#58a6ff"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#58a6ff" stroke-opacity=".04"/></pattern>
</defs>
<rect width="1000" height="420" rx="24" fill="url(#bg)"/><rect width="1000" height="420" rx="24" fill="url(#grid)"/>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <text x="48" y="52" fill="#f0f6fc" font-size="22" font-weight="700">BACKEND PORTFOLIO MATRIX</text>
  <text x="48" y="78" fill="#7d8590" font-size="13">four projects — four backend angles</text>

  <g transform="translate(48 108)">
    <rect width="430" height="120" rx="18" fill="#0d223a" stroke="#58a6ff" stroke-opacity=".4"/>
    <text x="24" y="32" fill="#79c0ff" font-size="13">01 / AI SERVICES</text>
    <text x="24" y="62" fill="#f0f6fc" font-size="19" font-weight="700">Alfabank AI Bot</text>
    <text x="24" y="88" fill="#9da7b3" font-size="13">Telegram → AI service → model layer</text>
    <circle cx="380" cy="58" r="24" fill="none" stroke="#58a6ff" stroke-opacity=".55"/>
    <circle cx="380" cy="58" r="8" fill="#58a6ff" opacity=".8" filter="url(#glow)"><animate attributeName="r" values="7;11;7" dur="2.6s" repeatCount="indefinite"/></circle>
  </g>

  <g transform="translate(522 108)">
    <rect width="430" height="120" rx="18" fill="#0d223a" stroke="#3fb950" stroke-opacity=".4"/>
    <text x="24" y="32" fill="#56d364" font-size="13">02 / DATA PERFORMANCE</text>
    <text x="24" y="62" fill="#f0f6fc" font-size="19" font-weight="700">PostgreSQL OLAP</text>
    <text x="24" y="88" fill="#9da7b3" font-size="13">indexes / materialized views / benchmarking</text>
    <path d="M360 78l16-24 14 14 20-32" fill="none" stroke="#56d364" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="410" cy="36" r="4" fill="#56d364" filter="url(#glow)"/>
  </g>

  <g transform="translate(48 252)">
    <rect width="430" height="120" rx="18" fill="#0d223a" stroke="#a371f7" stroke-opacity=".4"/>
    <text x="24" y="32" fill="#bc8cff" font-size="13">03 / API INTEGRATION</text>
    <text x="24" y="62" fill="#f0f6fc" font-size="19" font-weight="700">Marzban Bot</text>
    <text x="24" y="88" fill="#9da7b3" font-size="13">Aiogram → FastAPI → external API</text>
    <g fill="none" stroke="#bc8cff" stroke-width="2">
      <rect x="344" y="38" width="28" height="28" rx="6"/><rect x="400" y="38" width="28" height="28" rx="6"/>
      <path d="M372 52h28"/><path d="M392 47l8 5-8 5"/>
    </g>
  </g>

  <g transform="translate(522 252)">
    <rect width="430" height="120" rx="18" fill="#0d223a" stroke="#f2cc60" stroke-opacity=".4"/>
    <text x="24" y="32" fill="#e3b341" font-size="13">04 / WEB BACKEND</text>
    <text x="24" y="62" fill="#f0f6fc" font-size="19" font-weight="700">MemoPad</text>
    <text x="24" y="88" fill="#9da7b3" font-size="13">Flask / SQLite / auth / CRUD</text>
    <g fill="none" stroke="#e3b341" stroke-width="2">
      <rect x="350" y="34" width="68" height="48" rx="7"/><path d="M362 48h42M362 58h30M362 68h36"/>
    </g>
  </g>

  <path d="M478 168h44M478 312h44" stroke="url(#g1)" stroke-opacity=".22" stroke-dasharray="5 7"/>
  <path d="M263 228v24M737 228v24" stroke="url(#g2)" stroke-opacity=".22" stroke-dasharray="5 7"/>
